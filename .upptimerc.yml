# Pagina di stato di Zeno CMS / Zeno CMS status page
# Pubblicata su https://status.zenocms.io (GitHub Pages, controlli ogni 5 minuti con GitHub Actions).
# Nessun segreto in questo file: l'indirizzo del front dei domini sta nel secret FLY_HEALTH_URL.
owner: armonia
repo: zeno-status

# Elenco chiuso dei secret che i controlli possono usare.
secrets:
  - FLY_HEALTH_URL

sites:
  - name: Sito · Website
    url: https://zenocms.io
    slug: sito
    icon: https://zenocms.io/favicon.svg
  - name: API
    url: https://api.zenocms.io/health
    slug: api
  - name: MCP (agenti AI · AI agents)
    # Senza token l'MCP risponde 401: vuol dire che è su e che chiede l'accesso.
    url: https://api.zenocms.io/mcp
    slug: mcp
    method: POST
    headers:
      - "Content-Type: application/json"
      - "Accept: application/json, text/event-stream"
    body: '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
    expectedStatusCodes:
      - 401
  - name: Accesso · Login
    url: https://api.zenocms.io/api/auth/ok
    slug: accesso
  - name: REST dei siti · Site REST
    # Senza chiave risponde 401: è su e chiede l'accesso.
    url: https://api.zenocms.io/rest/v1/
    slug: rest
    expectedStatusCodes:
      - 401
  - name: Domini personalizzati · Custom domains
    url: $FLY_HEALTH_URL
    slug: domini
  - name: Prova finta (temporanea)
    url: https://zeno-prova-finta.invalid
    slug: prova-finta

status-website:
  cname: status.zenocms.io
  name: Zeno CMS · Stato / Status
  logoUrl: https://status.zenocms.io/zeno-icon.svg
  favicon: https://status.zenocms.io/zeno-icon.svg
  faviconSvg: https://status.zenocms.io/zeno-icon.svg
  theme: light
  introTitle: "**Stato dei servizi Zeno** · Zeno service status"
  introMessage: >-
    Controlli automatici ogni 5 minuti, fuori dall'infrastruttura di Zeno, con storico pubblico.
    · Automated checks every 5 minutes, hosted outside Zeno's own infrastructure, with a public history.
  navbar:
    - title: Stato · Status
      href: /
    - title: Zeno CMS
      href: https://zenocms.io
  metaTags:
    - name: "description"
      content: "Stato in tempo reale dei servizi Zeno CMS. Real-time status of Zeno CMS services."
  css: >-
    a { color: #a23bc4; }
    .logo { height: 28px; }

